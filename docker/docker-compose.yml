version: '3.9'

services:
  # ─── NestJS API ────────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: neet_api
    env_file:
      - ../.env
    ports:
      - '3001:3001'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - neet_network

  # ─── BullMQ Worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: neet_worker
    env_file:
      - ../.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - neet_network

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: neet_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - neet_network

  # ─── OpenTelemetry Collector (dev observability) ───────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: neet_otel
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml
    ports:
      - '4317:4317'   # gRPC
      - '4318:4318'   # HTTP
    networks:
      - neet_network

  # ─── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: neet_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    networks:
      - neet_network

  # ─── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: neet_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
    networks:
      - neet_network

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  neet_network:
    driver: bridge
